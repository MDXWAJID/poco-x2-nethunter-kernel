name: Build Phoenix baseline kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            bc \
            bison \
            flex \
            build-essential \
            gcc-aarch64-linux-gnu \
            libssl-dev \
            libelf-dev \
            device-tree-compiler \
            cpio \
            rsync \
            unzip \
            zip \
            python3

      - name: Clone crDroid kernel
        run: |
          git clone \
            --depth=1 \
            --branch 16.0 \
            https://github.com/crdroidandroid/android_kernel_xiaomi_sm6150.git \
            kernel

      - name: Show source information
        working-directory: kernel
        run: |
          echo "===== SOURCE ====="
          git rev-parse HEAD
          git log -1 --oneline
          echo
          echo "===== KERNEL VERSION ====="
          grep -E '^(VERSION|PATCHLEVEL|SUBLEVEL) =' Makefile

      - name: Create output directory
        run: |
          mkdir -p "$GITHUB_WORKSPACE/kernel/out"

      - name: Generate Phoenix base configuration
        working-directory: kernel
        run: |
          make \
            O="$PWD/out" \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            vendor/sdmsteppe-perf_defconfig

      - name: Add Phoenix configuration
        working-directory: kernel
        run: |
          ./scripts/kconfig/merge_config.sh \
            -O "$PWD/out" \
            "$PWD/arch/arm64/configs/vendor/phoenix.config"

      - name: Finalize configuration
        working-directory: kernel
        run: |
          make \
            O="$PWD/out" \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            olddefconfig

      - name: Verify Phoenix configuration
        working-directory: kernel
        run: |
          set -e

          CONFIG="$PWD/out/.config"

          echo "===== DEVICE ====="

          grep -q '^CONFIG_MACH_XIAOMI_PHOENIX=y$' "$CONFIG"
          echo "CONFIG_MACH_XIAOMI_PHOENIX=y OK"

          echo
          echo "===== ARCHITECTURE ====="

          grep -q '^CONFIG_ARM64=y$' "$CONFIG"
          echo "CONFIG_ARM64=y OK"

          echo
          echo "===== USB ====="

          grep -q '^CONFIG_USB=y$' "$CONFIG"
          echo "CONFIG_USB=y OK"

          echo
          echo "===== WIRELESS CORE ====="

          grep -q '^CONFIG_WLAN=y$' "$CONFIG"
          echo "CONFIG_WLAN=y OK"

          grep -q '^CONFIG_CFG80211=' "$CONFIG"
          echo "CONFIG_CFG80211 present"

          grep -q '^CONFIG_MAC80211=' "$CONFIG"
          echo "CONFIG_MAC80211 present"

          echo
          echo "===== AR9XXX STATUS ====="

          if grep -q '^CONFIG_ATH9K_HTC=' "$CONFIG"; then
            grep '^CONFIG_ATH9K_HTC=' "$CONFIG"
          else
            echo "CONFIG_ATH9K_HTC is not enabled yet"
            echo "This is EXPECTED for the baseline build."
          fi

          echo
          echo "===== CONFIGURATION CHECK PASSED ====="

      - name: Show important configuration
        working-directory: kernel
        run: |
          echo "===== IMPORTANT CONFIGURATION ====="

          grep -E \
            '^(CONFIG_MACH_XIAOMI_PHOENIX|CONFIG_ARM64|CONFIG_USB|CONFIG_WLAN|CONFIG_CFG80211|CONFIG_MAC80211|CONFIG_ATH|CONFIG_WLAN_VENDOR_ATH)' \
            out/.config || true

      - name: Build kernel
        working-directory: kernel
        run: |
          make \
            -j"$(nproc)" \
            O="$PWD/out" \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            Image.gz modules

      - name: Show build output
        working-directory: kernel
        run: |
          echo "===== KERNEL OUTPUT ====="

          ls -lh out/arch/arm64/boot/ || true

          echo
          echo "===== MODULE COUNT ====="

          find out -name '*.ko' -type f | wc -l

      - name: Package baseline artifacts
        working-directory: kernel
        run: |
          mkdir -p "$GITHUB_WORKSPACE/artifacts"

          cp out/arch/arm64/boot/Image.gz \
            "$GITHUB_WORKSPACE/artifacts/Image.gz"

          cp out/.config \
            "$GITHUB_WORKSPACE/artifacts/kernel.config"

          find out \
            -name '*.ko' \
            -type f \
            -exec cp --parents {} "$GITHUB_WORKSPACE/artifacts/" \;

      - name: Upload baseline kernel
        uses: actions/upload-artifact@v4
        with:
          name: phoenix-baseline-kernel
          path: artifacts/

      - name: Complete
        run: |
          echo "======================================"
          echo " PHOENIX BASELINE BUILD SUCCESSFUL"
          echo "======================================"
