name: POCO X2 NetHunter Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. INSTALL BUILD DEPENDENCIES
      # ============================================================
      - name: Install build dependencies
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            git \
            bc \
            bison \
            flex \
            build-essential \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            libssl-dev \
            libelf-dev \
            device-tree-compiler \
            cpio \
            rsync \
            unzip \
            zip \
            python3


      # ============================================================
      # 3. SHOW ENVIRONMENT
      # ============================================================
      - name: Show build environment
        run: |
          set -e

          echo "========================================"
          echo "          BUILD ENVIRONMENT"
          echo "========================================"

          echo
          echo "===== HOST ====="
          uname -a

          echo
          echo "===== CPU ====="
          nproc

          echo
          echo "===== MEMORY ====="
          free -h

          echo
          echo "===== DISK ====="
          df -h

          echo
          echo "===== CROSS COMPILER ====="
          aarch64-linux-gnu-gcc --version


      # ============================================================
      # 4. PREPARE KERNEL SOURCE
      # ============================================================
      - name: Prepare kernel source
        run: |
          set -e

          if [ ! -d "kernel" ]; then
            echo "kernel directory does not exist."
            echo "Cloning crDroid SM6150 kernel source..."

            git clone \
              --depth=1 \
              --branch 16.0 \
              https://github.com/crdroidandroid/android_kernel_xiaomi_sm6150.git \
              kernel
          else
            echo "kernel directory already exists."
          fi

          echo
          echo "===== KERNEL SOURCE ====="
          ls -la kernel

          echo
          echo "===== GIT ====="
          cd kernel

          git remote -v || true
          git branch --show-current || true
          git log -1 --oneline || true


      # ============================================================
      # 5. VERIFY SOURCE
      # ============================================================
      - name: Verify kernel source
        working-directory: kernel
        run: |
          set -e

          echo "========================================"
          echo "          SOURCE VERIFICATION"
          echo "========================================"

          echo
          echo "===== KERNEL VERSION ====="

          grep '^VERSION[[:space:]]*=' Makefile
          grep '^PATCHLEVEL[[:space:]]*=' Makefile
          grep '^SUBLEVEL[[:space:]]*=' Makefile

          echo
          echo "===== PHOENIX CONFIG FILE ====="

          test -f \
            arch/arm64/configs/vendor/phoenix.config

          grep -n \
            'CONFIG_MACH_XIAOMI_PHOENIX' \
            arch/arm64/configs/vendor/phoenix.config

          echo
          echo "===== ATH9K HTC ====="

          test -f \
            drivers/net/wireless/ath/ath9k/Kconfig

          grep -n \
            'config ATH9K_HTC' \
            drivers/net/wireless/ath/ath9k/Kconfig || true

          echo
          echo "===== AR9271 ====="

          grep -n \
            'AR9271' \
            drivers/net/wireless/ath/ath9k/Kconfig || true


      # ============================================================
      # 6. GENERATE BASE ARM64 CONFIGURATION
      # ============================================================
      - name: Generate Phoenix base configuration
        working-directory: kernel
        run: |
          set -e

          echo "========================================"
          echo "     GENERATING BASE CONFIGURATION"
          echo "========================================"

          rm -rf out

          mkdir -p out

          make \
            O="$PWD/out" \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            vendor/sdmsteppe-perf_defconfig

          echo
          echo "===== BASE CONFIG CREATED ====="

          test -f \
            "$PWD/out/.config"

          echo
          echo "===== BASE ARM64 ====="

          grep -n \
            '^CONFIG_ARM64=' \
            "$PWD/out/.config" || true

          echo
          echo "===== BASE PHOENIX ====="

          grep -n \
            'CONFIG_MACH_XIAOMI_PHOENIX' \
            "$PWD/out/.config" || true


      # ============================================================
      # 7. INSPECT PHOENIX FRAGMENT
      # ============================================================
      - name: Inspect Phoenix configuration
        working-directory: kernel
        run: |
          set -e

          echo "========================================"
          echo "       PHOENIX CONFIGURATION"
          echo "========================================"

          echo
          echo "===== PHOENIX SOURCE ====="

          grep -n \
            'CONFIG_MACH_XIAOMI_PHOENIX' \
            "$PWD/arch/arm64/configs/vendor/phoenix.config"

          echo
          echo "===== FULL PHOENIX CONFIG ====="

          cat \
            "$PWD/arch/arm64/configs/vendor/phoenix.config"


      # ============================================================
      # 8. MERGE PHOENIX CONFIGURATION
      #
      # IMPORTANT:
      # ARCH=arm64 is explicitly passed to merge_config.sh.
      # ============================================================
      - name: Merge Phoenix configuration
        working-directory: kernel
        run: |
          set -o pipefail

          echo "========================================"
          echo "       MERGING PHOENIX CONFIG"
          echo "========================================"

          ARCH=arm64 \
          CROSS_COMPILE=aarch64-linux-gnu- \
          ./scripts/kconfig/merge_config.sh \
            -O "$PWD/out" \
            "$PWD/out/.config" \
            "$PWD/arch/arm64/configs/vendor/phoenix.config" \
            2>&1 | tee "$PWD/out/phoenix-merge.log"

          echo
          echo "===== CONFIG AFTER MERGE ====="

          grep -n \
            '^CONFIG_ARM64=' \
            "$PWD/out/.config" || true

          grep -n \
            '^CONFIG_MACH_XIAOMI_PHOENIX=' \
            "$PWD/out/.config" || true


      # ============================================================
      # 9. FINALIZE ARM64 CONFIGURATION
      # ============================================================
      - name: Finalize configuration
        working-directory: kernel
        run: |
          set -e

          echo "========================================"
          echo "          FINALIZING CONFIG"
          echo "========================================"

          make \
            O="$PWD/out" \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            olddefconfig

          echo
          echo "===== FINAL CONFIG ====="

          echo
          echo "ARM64:"
          grep -n \
            '^CONFIG_ARM64=' \
            "$PWD/out/.config" || true

          echo
          echo "PHOENIX:"
          grep -n \
            '^CONFIG_MACH_XIAOMI_PHOENIX=' \
            "$PWD/out/.config" || true


      # ============================================================
      # 10. VERIFY FINAL CONFIGURATION
      # ============================================================
      - name: Verify final Phoenix configuration
        working-directory: kernel
        run: |
          set -e

          CONFIG="$PWD/out/.config"

          echo "========================================"
          echo "       FINAL CONFIG VERIFICATION"
          echo "========================================"

          echo
          echo "===== ARM64 ====="

          grep -n \
            '^CONFIG_ARM64=' \
            "$CONFIG"

          if ! grep -q \
            '^CONFIG_ARM64=y$' \
            "$CONFIG"; then

            echo
            echo "ERROR: ARM64 configuration is missing."

            exit 1
          fi

          echo "CONFIG_ARM64=y OK"


          echo
          echo "===== PHOENIX ====="

          grep -n \
            '^CONFIG_MACH_XIAOMI_PHOENIX=' \
            "$CONFIG"

          if ! grep -q \
            '^CONFIG_MACH_XIAOMI_PHOENIX=y$' \
            "$CONFIG"; then

            echo
            echo "ERROR: Phoenix configuration is missing."

            echo
            echo "Relevant Phoenix settings:"
            grep -i \
              'PHOENIX' \
              "$CONFIG" || true

            exit 1
          fi

          echo "CONFIG_MACH_XIAOMI_PHOENIX=y OK"


          echo
          echo "===== USB ====="

          grep -n \
            '^CONFIG_USB=' \
            "$CONFIG" || true


          echo
          echo "===== WLAN ====="

          grep -nE \
            '^(CONFIG_WLAN=|CONFIG_CFG80211=|CONFIG_MAC80211=)' \
            "$CONFIG" || true


          echo
          echo "===== ATH9K HTC ====="

          grep -n \
            '^CONFIG_ATH9K_HTC=' \
            "$CONFIG" || \
            echo "CONFIG_ATH9K_HTC is not enabled yet"


          echo
          echo "========================================"
          echo "       PHOENIX CONFIGURATION PASSED"
          echo "========================================"


      # ============================================================
      # 11. SHOW MERGE WARNINGS
      # ============================================================
      - name: Show configuration warnings
        if: always()
        working-directory: kernel
        run: |
          echo "========================================"
          echo "       CONFIGURATION MERGE LOG"
          echo "========================================"

          if [ -f "$PWD/out/phoenix-merge.log" ]; then
            cat "$PWD/out/phoenix-merge.log"
          else
            echo "No merge log found."
          fi


      # ============================================================
      # 12. UPLOAD DIAGNOSTIC ARTIFACT
      # ============================================================
      - name: Upload configuration diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phoenix-kernel-config-diagnostic
          include-hidden-files: true
          path: |
            kernel/out/.config
            kernel/out/phoenix-merge.log
            kernel/arch/arm64/configs/vendor/phoenix.config
          if-no-files-found: warn
