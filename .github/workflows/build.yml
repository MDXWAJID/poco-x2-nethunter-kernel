name: POCO X2 NetHunter Kernel Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      ARCH: arm64
      CLANG_TRIPLE: aarch64-linux-gnu-
      CROSS_COMPILE: aarch64-linux-androidkernel-
      LLVM: "1"
      LLVM_IAS: "1"

    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y \
            bc bison flex build-essential \
            clang llvm lld \
            libssl-dev libelf-dev device-tree-compiler \
            cpio rsync python3 unzip zip git

      - name: Prepare kernel source
        run: |
          set -e

          if [ ! -d kernel ]; then
            git clone \
              --branch 16.0 \
              --depth=1 \
              https://github.com/crdroidandroid/android_kernel_xiaomi_sm6150.git \
              kernel
          fi

          cd kernel
          git log -1 --oneline
          test -f Makefile
          test -f Kconfig
          test -f arch/arm64/configs/vendor/phoenix.config

      - name: Verify toolchain
        run: |
          set -e
          echo "===== CLANG ====="
          clang --version
          echo
          echo "===== LLVM ====="
          llvm-config --version
          echo
          echo "===== LLD ====="
          ld.lld --version
          echo
          echo "===== TARGET ====="
          echo "ARCH=$ARCH"
          echo "CLANG_TRIPLE=$CLANG_TRIPLE"
          echo "CROSS_COMPILE=$CROSS_COMPILE"
          echo "LLVM=$LLVM"
          echo "LLVM_IAS=$LLVM_IAS"

      - name: Generate base Phoenix configuration
        working-directory: kernel
        run: |
          set -e
          rm -rf out
          mkdir -p out

          make \
            O="$PWD/out" \
            ARCH="$ARCH" \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CLANG_TRIPLE="$CLANG_TRIPLE" \
            LLVM="$LLVM" \
            LLVM_IAS="$LLVM_IAS" \
            vendor/sdmsteppe-perf_defconfig

          test -f "$PWD/out/.config"

      - name: Merge Phoenix configuration
        working-directory: kernel
        run: |
          set -o pipefail

          ARCH="$ARCH" \
          CROSS_COMPILE="$CROSS_COMPILE" \
          CLANG_TRIPLE="$CLANG_TRIPLE" \
          LLVM="$LLVM" \
          LLVM_IAS="$LLVM_IAS" \
          ./scripts/kconfig/merge_config.sh \
            -O "$PWD/out" \
            "$PWD/out/.config" \
            "$PWD/arch/arm64/configs/vendor/phoenix.config" \
            2>&1 | tee "$PWD/out/phoenix-merge.log"

      - name: Enable AR9271 driver
        working-directory: kernel
        run: |
          set -e
          CONFIG="$PWD/out/.config"

          ./scripts/config --file "$CONFIG" \
            --enable USB \
            --enable WLAN \
            --enable CFG80211 \
            --enable MAC80211 \
            --enable WLAN_VENDOR_ATH \
            --enable ATH9K \
            --enable ATH9K_HW \
            --enable ATH9K_COMMON \
            --module ATH9K_HTC

      - name: Finalize configuration
        working-directory: kernel
        run: |
          set -e

          make \
            O="$PWD/out" \
            ARCH="$ARCH" \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CLANG_TRIPLE="$CLANG_TRIPLE" \
            LLVM="$LLVM" \
            LLVM_IAS="$LLVM_IAS" \
            olddefconfig

      - name: Verify final configuration
        working-directory: kernel
        run: |
          set -e
          CONFIG="$PWD/out/.config"

          echo "===== DEVICE ====="
          grep -E '^CONFIG_(ARM64|ARCH_QCOM|ARCH_SM6150|MACH_XIAOMI_PHOENIX)=' "$CONFIG" || true

          echo
          echo "===== USB / WIFI ====="
          grep -E '^CONFIG_(USB|WLAN|CFG80211|MAC80211|WLAN_VENDOR_ATH)=' "$CONFIG" || true

          echo
          echo "===== ATH9K ====="
          grep -E '^CONFIG_(ATH9K|ATH9K_HW|ATH9K_COMMON|ATH9K_HTC|MODULES)=' "$CONFIG" || true

          test "$(grep '^CONFIG_ARM64=' "$CONFIG")" = "CONFIG_ARM64=y"
          test "$(grep '^CONFIG_MACH_XIAOMI_PHOENIX=' "$CONFIG")" = "CONFIG_MACH_XIAOMI_PHOENIX=y"
          test "$(grep '^CONFIG_USB=' "$CONFIG")" = "CONFIG_USB=y"
          test "$(grep '^CONFIG_WLAN=' "$CONFIG")" = "CONFIG_WLAN=y"
          test "$(grep '^CONFIG_CFG80211=' "$CONFIG")" = "CONFIG_CFG80211=y"
          test "$(grep '^CONFIG_MAC80211=' "$CONFIG")" = "CONFIG_MAC80211=y"
          test "$(grep '^CONFIG_ATH9K_HTC=' "$CONFIG")" = "CONFIG_ATH9K_HTC=m"

      - name: Build kernel and modules
        working-directory: kernel
        run: |
          set -o pipefail

          make \
            -j"$(nproc)" \
            O="$PWD/out" \
            ARCH="$ARCH" \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CLANG_TRIPLE="$CLANG_TRIPLE" \
            LLVM="$LLVM" \
            LLVM_IAS="$LLVM_IAS" \
            Image.gz \
            modules \
            dtbs \
            2>&1 | tee "$PWD/out/build.log"

      - name: Verify build outputs
        working-directory: kernel
        run: |
          set -e

          test -s "$PWD/out/arch/arm64/boot/Image.gz"

          echo "===== KERNEL ====="
          ls -lh "$PWD/out/arch/arm64/boot/Image.gz"

          echo
          echo "===== ATH9K HTC MODULE ====="
          find "$PWD/out" -type f -name 'ath9k_htc.ko' -print -exec ls -lh {} \;

          test -n "$(find "$PWD/out" -type f -name 'ath9k_htc.ko' -print -quit)"

          echo
          echo "===== DTB FILES ====="
          find "$PWD/out" -type f -name '*.dtb' -print

      - name: Collect kernel artifact
        working-directory: kernel
        run: |
          set -e

          rm -rf package
          mkdir -p package/modules
          mkdir -p package/dtb

          cp "$PWD/out/arch/arm64/boot/Image.gz" "$PWD/package/Image.gz"

          find "$PWD/out" \
            -type f \
            -name 'ath9k_htc.ko' \
            -exec cp {} "$PWD/package/modules/" \;

          find "$PWD/out" \
            -type f \
            -name '*.dtb' \
            -exec cp {} "$PWD/package/dtb/" \;

          cp "$PWD/out/.config" "$PWD/package/config"
          cp "$PWD/out/build.log" "$PWD/package/build.log"

          echo "===== FINAL ARTIFACT ====="
          find "$PWD/package" -type f -print

      - name: Upload successful kernel artifact
        uses: actions/upload-artifact@v4
        with:
          name: POCO-X2-NetHunter-Kernel-Build
          path: kernel/package/**
          if-no-files-found: error

      - name: Upload diagnostics on every run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: POCO-X2-NetHunter-Diagnostics
          include-hidden-files: true
          path: |
            kernel/out/.config
            kernel/out/phoenix-merge.log
            kernel/out/build.log
            kernel/out/arch/arm64/boot/**
            kernel/out/**/*.dtb
            kernel/out/**/*.ko
          if-no-files-found: warn
