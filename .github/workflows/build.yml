name: POCO X2 - Build 1 - Baseline Kernel

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Phoenix baseline kernel
    runs-on: ubuntu-24.04

    steps:

      - name: Show machine
        run: |
          echo "CPU:"
          nproc

          echo
          echo "MEMORY:"
          free -h

          echo
          echo "STORAGE:"
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq

          sudo apt-get install -y \
            git \
            bc \
            bison \
            flex \
            build-essential \
            libssl-dev \
            libelf-dev \
            device-tree-compiler \
            cpio \
            rsync \
            unzip \
            zip \
            python3 \
            python3-pip

      - name: Clone kernel source
        run: |
          git clone \
            --depth=1 \
            --single-branch \
            --branch=16.0 \
            https://github.com/crdroidandroid/android_kernel_xiaomi_sm6150.git \
            kernel

      - name: Prepare output directory
        run: |
          mkdir -p kernel/out

      - name: Show source
        working-directory: kernel
        run: |
          echo "Commit:"
          git rev-parse HEAD

          echo
          echo "Kernel:"
          grep -E '^VERSION =|^PATCHLEVEL =|^SUBLEVEL =' Makefile

          echo
          echo "Phoenix config:"
          cat arch/arm64/configs/vendor/phoenix.config

      - name: Create base Phoenix configuration
        working-directory: kernel
        run: |
          make \
            O="$PWD/out" \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            vendor/sdmsteppe-perf_defconfig

      - name: Add Phoenix configuration
        working-directory: kernel
        run: |
          ./scripts/kconfig/merge_config.sh \
            -O "$PWD/out" \
            "$PWD/out/.config" \
            "$PWD/arch/arm64/configs/vendor/phoenix.config"

      - name: Finalize configuration
        working-directory: kernel
        run: |
          make \
            O="$PWD/out" \
            ARCH=arm64 \
            olddefconfig

      - name: Verify Phoenix configuration
        working-directory: kernel
        run: |
          echo "===== DEVICE ====="
          grep '^CONFIG_MACH_XIAOMI_PHOENIX=' out/.config

          echo
          echo "===== ATH9K HTC ====="
          grep '^CONFIG_ATH9K_HTC=' out/.config || true

          echo
          echo "===== ATH9K ====="
          grep '^CONFIG_ATH9K=' out/.config || true

          echo
          echo "===== MAC80211 ====="
          grep '^CONFIG_MAC80211=' out/.config || true

          echo
          echo "===== CFG80211 ====="
          grep '^CONFIG_CFG80211=' out/.config || true

          echo
          echo "===== USB ====="
          grep '^CONFIG_USB=' out/.config || true

      - name: Build kernel
        working-directory: kernel
        run: |
          make \
            -j"$(nproc)" \
            O="$PWD/out" \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            KCFLAGS="-Wno-error" \
            Image.gz \
            modules

      - name: Show build output
        working-directory: kernel
        run: |
          echo "===== KERNEL ====="
          ls -lh out/arch/arm64/boot/Image.gz

          echo
          echo "===== DTB ====="
          find out/arch/arm64/boot/dts \
            -type f \
            \( -name '*.dtb' -o -name '*.dtbo' \) \
            | head -100 || true

          echo
          echo "===== MODULES ====="
          find out \
            -type f \
            -name '*.ko' \
            | head -100 || true

      - name: Package baseline artifacts
        run: |
          mkdir -p artifacts

          cp kernel/out/arch/arm64/boot/Image.gz \
            artifacts/Image.gz

          cp kernel/out/.config \
            artifacts/phoenix.config

          find kernel/out \
            -type f \
            -name '*.ko' \
            -exec cp --parents {} artifacts/ \; || true

          cd artifacts
          zip -r ../poco-x2-baseline-kernel.zip .

      - name: Upload baseline kernel
        uses: actions/upload-artifact@v4
        with:
          name: poco-x2-baseline-kernel
          path: |
            poco-x2-baseline-kernel.zip
            kernel/out/.config  -type f \
              | sort \
              | head -500

          } > "$REPORT"

          echo
          echo "Audit report created:"
          ls -lh "$REPORT"

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: poco-x2-source-audit
          path: audit/source-audit.txt
          if-no-files-found: error
