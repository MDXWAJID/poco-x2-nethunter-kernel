name: POCO X2 Kernel - Source Audit

on:
  workflow_dispatch:

jobs:
  audit:
    name: Audit crDroid SM6150 16.0
    runs-on: ubuntu-24.04

    steps:

      - name: Show runner information
        run: |
          echo "========================================"
          echo "        GITHUB RUNNER INFORMATION"
          echo "========================================"

          echo
          echo "CPU:"
          nproc

          echo
          echo "MEMORY:"
          free -h

          echo
          echo "STORAGE:"
          df -h /

          echo
          echo "OS:"
          cat /etc/os-release

      - name: Install basic tools
        run: |
          sudo apt-get update -qq

          sudo apt-get install -y \
            git \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            device-tree-compiler \
            cpio \
            rsync \
            unzip \
            zip \
            python3

      - name: Clone crDroid kernel source
        run: |
          git clone \
            --depth=1 \
            --single-branch \
            --branch=16.0 \
            https://github.com/crdroidandroid/android_kernel_xiaomi_sm6150.git \
            kernel

      - name: Create audit directory
        run: |
          mkdir -p audit

      - name: Record kernel source information
        working-directory: kernel
        run: |
          echo "========================================"
          echo "        KERNEL SOURCE INFORMATION"
          echo "========================================"

          echo
          echo "Repository:"
          git remote get-url origin

          echo
          echo "Branch:"
          git branch --show-current

          echo
          echo "Commit:"
          git rev-parse HEAD

          echo
          echo "Commit date:"
          git log -1 --format='%ad' --date=iso

          echo
          echo "Commit subject:"
          git log -1 --format='%s'

          echo
          echo "Kernel version from Makefile:"
          grep -E '^VERSION =|^PATCHLEVEL =|^SUBLEVEL =' Makefile

          echo
          echo "Calculated kernel version:"
          make -s kernelversion 2>/dev/null || true

      - name: Search Phoenix device references
        working-directory: kernel
        run: |
          echo "========================================"
          echo "        PHOENIX REFERENCES"
          echo "========================================"

          grep -Rni \
            --exclude-dir=.git \
            -E 'phoenix|phoenixin' \
            arch/arm64/configs \
            arch/arm64/boot/dts \
            2>/dev/null \
            | head -300 || true

      - name: Search ATH9K HTC support
        working-directory: kernel
        run: |
          echo "========================================"
          echo "        ATH9K / ATH9K_HTC"
          echo "========================================"

          find drivers -type f \
            \( -iname '*ath9k*' -o -iname '*htc*' \) \
            | sort || true

          echo
          echo "Configuration references:"

          grep -Rni \
            --exclude-dir=.git \
            -E 'ATH9K|ATH9K_HTC|ATH9K_HTC_DEBUGFS' \
            drivers/net/wireless \
            drivers \
            2>/dev/null \
            | head -300 || true

      - name: Search USB wireless support
        working-directory: kernel
        run: |
          echo "========================================"
          echo "        USB WIRELESS SUPPORT"
          echo "========================================"

          grep -Rni \
            --exclude-dir=.git \
            -E 'USB_WLAN|USB_NET|WIRELESS' \
            drivers/net/wireless \
            drivers/usb \
            2>/dev/null \
            | head -300 || true

      - name: Find ARM64 configuration files
        working-directory: kernel
        run: |
          echo "========================================"
          echo "        ARM64 CONFIG FILES"
          echo "========================================"

          find arch/arm64/configs \
            -type f \
            | sort

      - name: Search Phoenix defconfig names
        working-directory: kernel
        run: |
          echo "========================================"
          echo "        POSSIBLE PHOENIX CONFIGS"
          echo "========================================"

          find . \
            -type f \
            -not -path './.git/*' \
            \( \
              -iname '*phoenix*' \
              -o -iname '*phoenixin*' \
              -o -iname '*defconfig*' \
            \) \
            | sort \
            | head -500

      - name: Search build configuration references
        working-directory: kernel
        run: |
          echo "========================================"
          echo "        BUILD CONFIG REFERENCES"
          echo "========================================"

          grep -Rni \
            --exclude-dir=.git \
            -E 'phoenix_defconfig|phoenixin_defconfig|sm6150' \
            Makefile \
            arch/arm64 \
            scripts \
            2>/dev/null \
            | head -300 || true

      - name: Inspect kernel architecture
        working-directory: kernel
        run: |
          echo "========================================"
          echo "        ARCHITECTURE"
          echo "========================================"

          echo
          echo "ARM64 directory:"
          ls -la arch/arm64 | head -50

          echo
          echo "ARM64 boot directory:"
          ls -la arch/arm64/boot | head -100

      - name: Create complete audit report
        run: |
          REPORT="$GITHUB_WORKSPACE/audit/source-audit.txt"

          {
            echo "============================================================"
            echo "POCO X2 / PHOENIX crDroid KERNEL SOURCE AUDIT"
            echo "============================================================"

            echo
            echo "DATE:"
            date -u

            echo
            echo "============================================================"
            echo "RUNNER"
            echo "============================================================"

            echo
            echo "CPU:"
            nproc

            echo
            echo "MEMORY:"
            free -h

            echo
            echo "STORAGE:"
            df -h /

            echo
            echo "============================================================"
            echo "SOURCE"
            echo "============================================================"

            cd "$GITHUB_WORKSPACE/kernel"

            echo
            echo "Repository:"
            git remote get-url origin

            echo
            echo "Branch:"
            git branch --show-current

            echo
            echo "Commit:"
            git rev-parse HEAD

            echo
            echo "Commit date:"
            git log -1 --format='%ad' --date=iso

            echo
            echo "Commit subject:"
            git log -1 --format='%s'

            echo
            echo "Kernel Makefile version:"
            grep -E '^VERSION =|^PATCHLEVEL =|^SUBLEVEL =' Makefile

            echo
            echo "Kernel version:"
            make -s kernelversion 2>/dev/null || true

            echo
            echo "============================================================"
            echo "PHOENIX REFERENCES"
            echo "============================================================"

            grep -Rni \
              --exclude-dir=.git \
              -E 'phoenix|phoenixin' \
              arch/arm64/configs \
              arch/arm64/boot/dts \
              2>/dev/null \
              | head -500 || true

            echo
            echo "============================================================"
            echo "ATH9K / ATH9K_HTC"
            echo "============================================================"

            find drivers -type f \
              \( -iname '*ath9k*' -o -iname '*htc*' \) \
              | sort || true

            echo
            grep -Rni \
              --exclude-dir=.git \
              -E 'ATH9K|ATH9K_HTC|ATH9K_HTC_DEBUGFS' \
              drivers/net/wireless \
              drivers \
              2>/dev/null \
              | head -500 || true

            echo
            echo "============================================================"
            echo "ARM64 CONFIGURATION FILES"
            echo "============================================================"

            find arch/arm64/configs \
              -type f \
              | sort

            echo
            echo "============================================================"
            echo "POSSIBLE PHOENIX CONFIGURATIONS"
            echo "============================================================"

            find . \
              -type f \
              -not -path './.git/*' \
              \( \
                -iname '*phoenix*' \
                -o -iname '*phoenixin*' \
                -o -iname '*defconfig*' \
              \) \
              | sort \
              | head -1000

            echo
            echo "============================================================"
            echo "USB / WIRELESS REFERENCES"
            echo "============================================================"

            grep -Rni \
              --exclude-dir=.git \
              -E 'USB_WLAN|USB_NET|WIRELESS' \
              drivers/net/wireless \
              drivers/usb \
              2>/dev/null \
              | head -500 || true

            echo
            echo "============================================================"
            echo "BOOT DIRECTORY"
            echo "============================================================"

            find arch/arm64/boot \
              -maxdepth 2 \
              -type f \
              | sort \
              | head -500

          } > "$REPORT"

          echo
          echo "Audit report created:"
          ls -lh "$REPORT"

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: poco-x2-source-audit
          path: audit/source-audit.txt
          if-no-files-found: error
