name: POCO X2 NetHunter Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y \
            git bc bison flex build-essential \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            libssl-dev libelf-dev device-tree-compiler \
            cpio rsync unzip zip python3

      - name: Prepare kernel source
        run: |
          set -e

          if [ ! -d kernel ]; then
            git clone \
              --depth=1 \
              --branch 16.0 \
              https://github.com/crdroidandroid/android_kernel_xiaomi_sm6150.git \
              kernel
          fi

          test -f kernel/arch/arm64/configs/vendor/phoenix.config
          test -f kernel/drivers/net/wireless/ath/ath9k/Kconfig

      - name: Generate Phoenix configuration
        working-directory: kernel
        run: |
          set -e

          rm -rf out
          mkdir -p out

          make \
            O="$PWD/out" \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            vendor/sdmsteppe-perf_defconfig

          test -f "$PWD/out/.config"

      - name: Merge Phoenix configuration
        working-directory: kernel
        run: |
          set -o pipefail

          ARCH=arm64 \
          CROSS_COMPILE=aarch64-linux-gnu- \
          ./scripts/kconfig/merge_config.sh \
            -O "$PWD/out" \
            "$PWD/out/.config" \
            "$PWD/arch/arm64/configs/vendor/phoenix.config" \
            2>&1 | tee "$PWD/out/phoenix-merge.log"

      - name: Enable NetHunter wireless driver
        working-directory: kernel
        run: |
          set -e

          CONFIG="$PWD/out/.config"

          echo "===== BEFORE ATH9K HTC ====="
          grep -E \
            '^(CONFIG_USB=|CONFIG_WLAN=|CONFIG_CFG80211=|CONFIG_MAC80211=|CONFIG_ATH9K=|CONFIG_ATH9K_HTC=)' \
            "$CONFIG" || true

          ./scripts/config --file "$CONFIG" \
            --enable USB \
            --enable WLAN \
            --enable CFG80211 \
            --enable MAC80211 \
            --enable WLAN_VENDOR_ATH \
            --enable ATH9K \
            --enable ATH9K_HW \
            --enable ATH9K_COMMON \
            --module ATH9K_HTC

          echo
          echo "===== AFTER ATH9K HTC ====="

          grep -E \
            '^(CONFIG_USB=|CONFIG_WLAN=|CONFIG_CFG80211=|CONFIG_MAC80211=|CONFIG_WLAN_VENDOR_ATH=|CONFIG_ATH9K=|CONFIG_ATH9K_HW=|CONFIG_ATH9K_COMMON=|CONFIG_ATH9K_HTC=)' \
            "$CONFIG" || true

      - name: Finalize configuration
        working-directory: kernel
        run: |
          set -e

          make \
            O="$PWD/out" \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            olddefconfig

      - name: Verify final configuration
        working-directory: kernel
        run: |
          set -e

          CONFIG="$PWD/out/.config"

          echo "===== FINAL DEVICE ====="
          grep '^CONFIG_MACH_XIAOMI_PHOENIX=' "$CONFIG"

          echo "===== FINAL ARCH ====="
          grep '^CONFIG_ARM64=' "$CONFIG"

          echo "===== FINAL USB/WIRELESS ====="
          grep -E \
            '^(CONFIG_USB=|CONFIG_WLAN=|CONFIG_CFG80211=|CONFIG_MAC80211=|CONFIG_WLAN_VENDOR_ATH=)' \
            "$CONFIG"

          echo "===== FINAL ATH9K ====="
          grep -E \
            '^(CONFIG_ATH9K=|CONFIG_ATH9K_HW=|CONFIG_ATH9K_COMMON=|CONFIG_ATH9K_HTC=)' \
            "$CONFIG"

          test "$(grep '^CONFIG_MACH_XIAOMI_PHOENIX=' "$CONFIG")" = "CONFIG_MACH_XIAOMI_PHOENIX=y"
          test "$(grep '^CONFIG_ARM64=' "$CONFIG")" = "CONFIG_ARM64=y"
          test "$(grep '^CONFIG_USB=' "$CONFIG")" = "CONFIG_USB=y"
          test "$(grep '^CONFIG_WLAN=' "$CONFIG")" = "CONFIG_WLAN=y"
          test "$(grep '^CONFIG_CFG80211=' "$CONFIG")" = "CONFIG_CFG80211=y"
          test "$(grep '^CONFIG_MAC80211=' "$CONFIG")" = "CONFIG_MAC80211=y"
          test "$(grep '^CONFIG_ATH9K_HTC=' "$CONFIG")" = "CONFIG_ATH9K_HTC=m"

      - name: Build kernel
        working-directory: kernel
        run: |
          set -e

          make \
            -j"$(nproc)" \
            O="$PWD/out" \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            Image.gz \
            modules \
            dtbs

      - name: Collect kernel outputs
        working-directory: kernel
        run: |
          set -e

          rm -rf "$PWD/package"
          mkdir -p "$PWD/package/modules"

          test -f "$PWD/out/arch/arm64/boot/Image.gz"

          cp \
            "$PWD/out/arch/arm64/boot/Image.gz" \
            "$PWD/package/Image.gz"

          find "$PWD/out" \
            -type f \
            -name '*.dtb' \
            -exec cp {} "$PWD/package/" \;

          find "$PWD/out" \
            -type f \
            -name 'ath9k_htc.ko' \
            -exec cp {} "$PWD/package/modules/" \;

          echo "===== PACKAGE CONTENTS ====="
          find "$PWD/package" -type f -print

      - name: Prepare AnyKernel3
        run: |
          set -e

          git clone \
            --depth=1 \
            https://github.com/osm0sis/AnyKernel3.git \
            anykernel3

          rm -rf anykernel3/.git

          rm -rf anykernel3/modules
          mkdir -p anykernel3/modules

          cp kernel/package/Image.gz anykernel3/

          find kernel/package/modules \
            -type f \
            -name '*.ko' \
            -exec cp {} anykernel3/modules/ \;

          find kernel/package \
            -maxdepth 1 \
            -type f \
            -name '*.dtb' \
            -exec cp {} anykernel3/ \;

      - name: Configure AnyKernel3
        run: |
          set -e

          cat > anykernel3/anykernel.sh <<'EOF'
          # AnyKernel3 Ramdisk Mod Script
          # POCO X2 / Phoenix
          properties() { '
          kernel.string=POCO X2 NetHunter Kernel
          do.devicecheck=0
          do.modules=1
          do.systemless=0
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=phoenix
          device.name2=phoenixin
          '; }

          block=boot;
          is_slot_device=0;

          . tools/ak3-core.sh;
          dump_boot;
          split_boot;

          replace_kernel;
          patch_cmdline;

          if [ -d modules ]; then
            bind_mount_modules;
            cp -af modules/* "$ramdisk/lib/modules/" 2>/dev/null || true;
          fi

          flash_boot;
          ```

      - name: Build flashable kernel ZIP
        run: |
          set -e

          cd anykernel3

          zip -r9 \
            ../POCO-X2-NetHunter-Kernel.zip \
            . \
            -x '*.git*' \
            -x 'README.md'

      - name: Upload flashable kernel ZIP
        uses: actions/upload-artifact@v4
        with:
          name: POCO-X2-NetHunter-Kernel
          path: POCO-X2-NetHunter-Kernel.zip
          if-no-files-found: error

      - name: Upload raw kernel and diagnostics
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: POCO-X2-NetHunter-Build-Diagnostics
          include-hidden-files: true
          path: |
            kernel/out/.config
            kernel/out/phoenix-merge.log
            kernel/out/arch/arm64/boot/Image.gz
            kernel/out/**/*.dtb
            kernel/out/**/*.ko
            kernel/package/**
          if-no-files-found: warn
